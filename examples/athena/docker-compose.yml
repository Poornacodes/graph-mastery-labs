# Section E.10 — Athena as a Docker Compose stack (API + Neo4j).
# From the repository root, with the lab stack stopped (`docker compose down`):
#   docker compose -f examples/athena/docker-compose.yml up -d --build
# then build the graph into it from the host:
#   cd examples/athena && python run_all.py
services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-graphmastery}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    ports: ["7474:7474", "7687:7687"]
    volumes: [athena_data:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 30
  api:
    build:
      context: ../..
      dockerfile: examples/athena/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphmastery}
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      neo4j: { condition: service_healthy }
volumes:
  athena_data:
